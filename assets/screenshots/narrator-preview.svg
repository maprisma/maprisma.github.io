<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" font-family="Inter, system-ui, -apple-system, sans-serif">
  <rect width="1120" height="700" fill="#0d121d"/>
  <!-- Document Window -->
  <rect x="64" y="52" width="620" height="596" rx="14" fill="#151d2d" stroke="#283854" stroke-width="1.5"/>
  <text x="96" y="92" fill="#8b9bb4" font-size="12" font-weight="600">PDF / KINDLE / WINDOW · LOCAL OCR (TESSERACT)</text>
  <text x="96" y="138" fill="#eef4fc" font-size="22" font-weight="700">Chapter 4: Local-First Intelligence</text>
  <rect x="88" y="164" width="572" height="96" rx="8" fill="#4dd6c8" fill-opacity="0.14" stroke="#4dd6c8" stroke-width="2"/>
  <text x="104" y="194" fill="#eef4fc" font-size="15">When reading technical books or articles in another language,</text>
  <text x="104" y="218" fill="#eef4fc" font-size="15">Maprisma Narrator highlights the active passage on screen and</text>
  <text x="104" y="242" fill="#eef4fc" font-size="15">speaks it aloud in a natural local voice — or translates first.</text>
  <text x="104" y="298" fill="#7c8ea8" font-size="15">After finishing a page, the Wayland helper can automatically turn</text>
  <text x="104" y="322" fill="#7c8ea8" font-size="15">to the next Kindle or PDF page and continue reading seamlessly.</text>
  <rect x="104" y="362" width="520" height="10" rx="5" fill="#202c43"/>
  <rect x="104" y="386" width="480" height="10" rx="5" fill="#202c43"/>
  <rect x="104" y="410" width="500" height="10" rx="5" fill="#202c43"/>
  <!-- Narrator Applet Panel -->
  <rect x="720" y="52" width="336" height="596" rx="14" fill="#172033" stroke="#34496d" stroke-width="1.5"/>
  <text x="748" y="92" fill="#eef4fc" font-size="16" font-weight="700">Maprisma Narrator</text>
  <text x="748" y="114" fill="#86c79c" font-size="12" font-weight="600">● Reading aloud · Passage 2 of 9</text>
  <rect x="748" y="140" width="280" height="78" rx="10" fill="#111827" stroke="#273754"/>
  <text x="766" y="166" fill="#8fa1bc" font-size="11" font-weight="600">VOICE ENGINE (51 LANGUAGES)</text>
  <text x="766" y="190" fill="#eef4fc" font-size="14" font-weight="600">Kokoro · Local Neural TTS</text>
  <text x="766" y="208" fill="#4dd6c8" font-size="12">Speed 1.05× · Offline</text>
  <rect x="748" y="236" width="280" height="88" rx="10" fill="#111827" stroke="#273754"/>
  <text x="766" y="262" fill="#8fa1bc" font-size="11" font-weight="600">TRANSLATION → SPEAK IN</text>
  <text x="766" y="286" fill="#eef4fc" font-size="14" font-weight="600">English page → Speak Deutsch</text>
  <text x="766" y="308" fill="#8fa1bc" font-size="12">via Ollama / llama.cpp / NLLB-200</text>
  <!-- Controls -->
  <rect x="748" y="348" width="86" height="40" rx="8" fill="#23324d"/>
  <text x="791" y="373" text-anchor="middle" fill="#eef4fc" font-size="13">⏮ Prev</text>
  <rect x="845" y="348" width="86" height="40" rx="8" fill="#4dd6c8"/>
  <text x="888" y="373" text-anchor="middle" fill="#101826" font-size="13" font-weight="700">⏸ Pause</text>
  <rect x="942" y="348" width="86" height="40" rx="8" fill="#23324d"/>
  <text x="985" y="373" text-anchor="middle" fill="#eef4fc" font-size="13">Next ⏭</text>
  <rect x="748" y="410" width="280" height="40" rx="8" fill="#202e47"/>
  <text x="888" y="435" text-anchor="middle" fill="#4dd6c8" font-size="13" font-weight="600">Read Selected Area (slurp)</text>
  <rect x="748" y="462" width="280" height="40" rx="8" fill="#202e47"/>
  <text x="888" y="487" text-anchor="middle" fill="#dce6f5" font-size="13">Auto-turn Kindle / PDF pages ✓</text>
</svg>