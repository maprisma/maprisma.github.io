<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" font-family="Inter, system-ui, -apple-system, sans-serif">
  <rect width="1120" height="700" fill="#0b0f18"/>
  <!-- Simulated Video Frame -->
  <rect x="56" y="44" width="1008" height="612" rx="16" fill="#131c2e" stroke="#283856" stroke-width="1.5"/>
  <circle cx="560" cy="270" r="56" fill="#1e2c47" stroke="#4dd6c8" stroke-width="2"/>
  <polygon points="548,248 586,270 548,292" fill="#4dd6c8"/>
  <text x="560" y="356" text-anchor="middle" fill="#7f93b2" font-size="13">Fullscreen Video / Stream / Call (Wayland wlr-layer-shell overlay)</text>
  <!-- Top applet popup -->
  <rect x="740" y="64" width="298" height="210" rx="12" fill="#172033" stroke="#364b70" stroke-width="1.5"/>
  <text x="762" y="94" fill="#eef4fc" font-size="14" font-weight="600">Maprisma Video Translator</text>
  <rect x="962" y="77" width="54" height="22" rx="11" fill="#86c79c" fill-opacity="0.2"/>
  <text x="989" y="92" text-anchor="middle" fill="#86c79c" font-size="11" font-weight="600">LIVE</text>
  <text x="762" y="124" fill="#8fa1bc" font-size="12">Speech: Whisper (local GPU)</text>
  <text x="762" y="148" fill="#8fa1bc" font-size="12">Translator: llama.cpp · Qwen 27B</text>
  <text x="762" y="172" fill="#4dd6c8" font-size="12" font-weight="600">English  →  Deutsch</text>
  <rect x="762" y="192" width="122" height="30" rx="7" fill="#23324d"/>
  <text x="823" y="211" text-anchor="middle" fill="#dce6f5" font-size="12">Settings…</text>
  <rect x="894" y="192" width="122" height="30" rx="7" fill="#23324d"/>
  <text x="955" y="211" text-anchor="middle" fill="#f7768e" font-size="12">Pause</text>
  <!-- Floating Live Caption Overlay -->
  <rect x="156" y="492" width="808" height="122" rx="14" fill="#0d1320" fill-opacity="0.94" stroke="#4dd6c8" stroke-width="2"/>
  <text x="560" y="534" text-anchor="middle" fill="#93a5c0" font-size="15">“We run the entire speech recognition and translation pipeline right on your GPU.”</text>
  <text x="560" y="574" text-anchor="middle" fill="#eef4fc" font-size="21" font-weight="600">„Wir führen die gesamte Spracherkennung und Übersetzung direkt auf Ihrer GPU aus.“</text>
  <text x="560" y="600" text-anchor="middle" fill="#4dd6c8" font-size="11">Overlay stays above fullscreen video · Drag to move or resize</text>
</svg>