<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="aura" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7aa2ff"/><stop offset="0.5" stop-color="#b48cff"/><stop offset="1" stop-color="#4dd6c8"/>
    </linearGradient>
  </defs>
  <rect width="1120" height="700" fill="#0c101a"/>
  <!-- Top Desktop Bar -->
  <rect x="0" y="0" width="1120" height="36" fill="#141b29"/>
  <text x="24" y="23" fill="#9fb0c9" font-size="12" font-weight="600">1   2   3   4</text>
  <text x="560" y="23" text-anchor="middle" fill="#dce6f5" font-size="12" font-weight="600">Sat 21:30</text>
  <circle cx="1040" cy="18" r="7" fill="none" stroke="url(#aura)" stroke-width="2"/>
  <text x="1056" y="22" fill="#4dd6c8" font-size="11">Listening</text>
  <!-- Aura Pill Overlay -->
  <rect x="276" y="66" width="568" height="68" rx="34" fill="#171d2e" stroke="url(#aura)" stroke-width="3"/>
  <circle cx="316" cy="100" r="18" fill="#232b42" stroke="url(#aura)" stroke-width="2"/>
  <rect x="311" y="90" width="10" height="15" rx="5" fill="#eef0ff"/>
  <text x="350" y="96" fill="#eef4fc" font-size="15" font-weight="500">“Switch to dark theme and open Maprisma Mail on workspace 2”</text>
  <text x="350" y="117" fill="#4dd6c8" font-size="12">whisper.cpp (Vulkan · local GPU) · 34 ms · D-Bus com.maprisma.Voice1</text>
  <!-- Action confirmation card -->
  <rect x="276" y="154" width="568" height="238" rx="16" fill="#141b2b" stroke="#293856" stroke-width="1.5"/>
  <text x="304" y="188" fill="#8b9bb4" font-size="11" font-weight="600" letter-spacing="0.8">PROPOSED DESKTOP ACTIONS · ASK AI</text>
  <rect x="304" y="204" width="512" height="54" rx="10" fill="#1a2438" stroke="#314569"/>
  <text x="324" y="228" fill="#eef4fc" font-size="14" font-weight="600">1. Apply dark theme (Tokyo Night)</text>
  <text x="324" y="246" fill="#86c79c" font-size="12">✓ Allowed in Maprisma Settings › AI</text>
  <rect x="304" y="270" width="512" height="54" rx="10" fill="#1a2438" stroke="#314569"/>
  <text x="324" y="294" fill="#eef4fc" font-size="14" font-weight="600">2. Launch Maprisma Mail on Workspace 2</text>
  <text x="324" y="312" fill="#8fa1bc" font-size="12">Press Enter to run · Esc to cancel</text>
  <rect x="708" y="342" width="108" height="32" rx="8" fill="#4dd6c8"/>
  <text x="762" y="363" text-anchor="middle" fill="#101826" font-size="12.5" font-weight="700">Run (Enter)</text>
  <!-- Voice bus diagram below -->
  <rect x="190" y="438" width="740" height="190" rx="14" fill="#121826" stroke="#22304a"/>
  <text x="220" y="472" fill="#eef4fc" font-size="15" font-weight="600">Shared Voice Service for Every Maprisma App</text>
  <text x="220" y="496" fill="#8fa1bc" font-size="13">Runs 100% offline on your GPU via whisper.cpp + Vulkan, keeping the model warm in memory.</text>
  <g transform="translate(220, 524)">
    <rect x="0" y="0" width="210" height="72" rx="10" fill="#182235" stroke="#2d3f61"/>
    <text x="18" y="28" fill="#4dd6c8" font-size="13" font-weight="600">COSMIC Panel Applet</text>
    <text x="18" y="50" fill="#8fa1bc" font-size="12">State icons: idle / listening</text>
    <rect x="235" y="0" width="210" height="72" rx="10" fill="#182235" stroke="#2d3f61"/>
    <text x="253" y="28" fill="#86c79c" font-size="13" font-weight="600">KDE &amp; Hyprland Tray</text>
    <text x="253" y="50" fill="#8fa1bc" font-size="12">SNI tray + global shortcut</text>
    <rect x="470" y="0" width="210" height="72" rx="10" fill="#182235" stroke="#2d3f61"/>
    <text x="488" y="28" fill="#bb9af7" font-size="13" font-weight="600">D-Bus Voice1 API</text>
    <text x="488" y="50" fill="#8fa1bc" font-size="12">Used across Maprisma apps</text>
  </g>
</svg>